project_id = "pigxel"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = false
[studio]
enabled = true
port = 54323
[local_smtp]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm", "http://localhost:3000/auth/callback?next=/auth/update-password", "http://localhost:3000/auth/callback?next=/settings/account", "http://localhost:3000/auth/callback?next=/settings/account&provider=apple"]
jwt_expiry = 3600
enable_signup = true
# Lets people who signed up with email link a Google account for Drive.
enable_manual_linking = true
[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
[analytics]
enabled = false

[auth.email.template.recovery]
subject = "Reset your Pigxel password"
content_path = "./supabase/templates/recovery.html"

# Google sign-in and account linking; also grants Google Drive (drive.file).
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

# Apple sign-in and account linking. Needs an Apple Developer account: set the
# Services ID as APPLE_CLIENT_ID and the generated client secret (a JWT signed
# with your key) as APPLE_SECRET, then set enabled = true.
[auth.external.apple]
enabled = false
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_SECRET)"
